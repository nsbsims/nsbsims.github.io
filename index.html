<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSB Science Simulations</title>
<meta name="description" content="Interactive science simulations for HSC students.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7285'/%3E%3Ccircle cx='25' cy='32' r='11' fill='%23fff'/%3E%3Ccircle cx='43' cy='32' r='8' fill='%2334d3ee'/%3E%3C/svg%3E">
<script>(function(){var t=null;try{t=localStorage.getItem("nsb-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
/* ===== theme + page shell: shared by every page on the site ===== */
:root{
  color-scheme:dark;
  --bg:#0a0d18; --panel:#141a2b; --panel-2:#1b2236; --line:#27304a;
  --ink:#e8edf7; --muted:#9aa7c2; --cyan:#34d3ee; --green:#34d399;
  --red:#fb7185; --amber:#fbbf24;
  --on-accent:#04212b; --on-status:#07261b; --thumb:#e8edf7;
  --accent-soft:rgba(52,211,238,.45); --glow:rgba(52,211,238,.5);
  --off-bg:#2a3550; --off-ink:#5d6a8a; --card-shadow:none;
  --page-grad:radial-gradient(1100px 500px at 20% -10%, #161d33 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #11203a 0%, transparent 55%);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f9; --panel:#ffffff; --panel-2:#eef1f7; --line:#d0d7e4;
  --ink:#141b2d; --muted:#4f5d78; --cyan:#0b7285; --green:#0a7a52;
  --red:#c2264b; --amber:#935400;
  --on-accent:#ffffff; --on-status:#ffffff; --thumb:#ffffff;
  --accent-soft:rgba(11,114,133,.35); --glow:rgba(11,114,133,.22);
  --off-bg:#e1e6ee; --off-ink:#8c96aa; --card-shadow:0 1px 2px rgba(20,27,45,.05), 0 6px 18px -12px rgba(20,27,45,.18);
  --page-grad:none;
}
/* surfaces that stay dark in both themes, like a screen */
.screen, .chip, .tip{
  color-scheme:dark;
  --bg:#0a0d18; --panel:#141a2b; --panel-2:#1b2236; --line:#27304a;
  --ink:#e8edf7; --muted:#9aa7c2; --cyan:#34d3ee; --green:#34d399; --red:#fb7185; --amber:#fbbf24;
  --on-accent:#04212b; --on-status:#07261b; --thumb:#e8edf7; --off-bg:#2a3550; --off-ink:#5d6a8a;
}
.screen{ background:#0b1020; color:var(--ink); border:1px solid var(--line); border-radius:11px; }

/* top bar: back link, full-screen button, light/dark switch */
.topbar{ display:flex; align-items:center; gap:8px; margin:0 0 18px; min-height:2.25rem; }
.topbar .back{ margin:0; }
.topbar .sp{ flex:1 1 auto; }
.back{ display:inline-block; font-family:var(--sans); font-size:.9rem; font-weight:600; letter-spacing:0; color:var(--muted); text-decoration:none; padding:.35rem 0; }
.back:hover{ color:var(--cyan); }
button.tool{ display:inline-flex; align-items:center; gap:.45rem; background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:.45rem .8rem; font-family:var(--sans); font-size:.82rem; font-weight:600; cursor:pointer; box-shadow:none; line-height:1.2; }
button.tool:hover{ color:var(--ink); border-color:var(--cyan); background:var(--panel); }
button.tool:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
button.tool svg{ width:1rem; height:1rem; flex:0 0 auto; }
button.tool[hidden]{ display:none; }
@media (max-width:560px){ button.tool .lbl{ display:none; } button.tool{ padding:.55rem; } }

/* how-to-use steps */
.howto{ margin:0 0 18px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:var(--card-shadow); }
.howto > summary{ cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:.6rem .95rem; font-size:.84rem; font-weight:700; color:var(--muted); }
.howto > summary::-webkit-details-marker{ display:none; }
.howto > summary::after{ content:"Show"; font-weight:600; font-size:.78rem; color:var(--cyan); }
.howto[open] > summary::after{ content:"Hide"; }
.howto ol{ list-style:none; counter-reset:step; margin:0; padding:0 .95rem .9rem; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:.6rem 1.1rem; }
.howto li{ counter-increment:step; display:flex; gap:.6rem; align-items:flex-start; font-size:.92rem; line-height:1.4; color:var(--ink); min-width:0; }
.howto li::before{ content:counter(step); flex:0 0 1.55rem; height:1.55rem; border-radius:50%; background:var(--cyan); color:var(--on-accent); font-weight:700; font-size:.82rem; display:flex; align-items:center; justify-content:center; }
@media (max-width:720px){ .howto ol{ grid-auto-flow:row; grid-auto-columns:auto; grid-template-columns:minmax(0,1fr); } }

/* fold-outs */
details.more{ border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:10px; box-shadow:var(--card-shadow); }
details.more > summary{ cursor:pointer; padding:.85rem 1rem; font-weight:700; font-size:.98rem; list-style:none; display:flex; align-items:center; gap:10px; color:var(--ink); }
details.more > summary::-webkit-details-marker{ display:none; }
details.more > summary::after{ content:"+"; margin-left:auto; font-family:var(--mono); color:var(--cyan); font-size:1.15rem; line-height:1; }
details.more[open] > summary::after{ content:"–"; }
details.more > summary .tag{ font-size:.76rem; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:.15rem .6rem; white-space:nowrap; }
details.more > .body{ padding:0 1rem 1rem; color:var(--muted); font-size:.93rem; line-height:1.6; }
details.more > .body p{ margin:0 0 10px; } details.more > .body p:last-child{ margin:0; }
details.more > .body b{ color:var(--ink); }
details.more > .body ul{ margin:0 0 10px; padding-left:20px; } details.more > .body li{ margin-bottom:5px; }
details.more > .body ul ul{ margin:5px 0 0; }
.more-head{ font-size:.84rem; font-weight:700; color:var(--muted); margin:26px 2px 10px; }

/* full-screen presentation mode: larger text, page fills the screen */
html.present{ font-size:calc(100% * var(--ui, 1.25)); }
html.present body{ padding:16px 28px 40px; }
html.present .wrap, html.present .wrap.wide{ max-width:none; }
html.present .back, html.present .eyebrow, html.present .lede, html.present .howto, html.present .syl, html.present a.worksheet, html.present .more-head{ display:none; }
html.present .topbar{ margin-bottom:6px; }
html.present h1{ font-size:1.35rem; margin:0 0 12px; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{ font-family:var(--sans); background:var(--page-grad), var(--bg); color:var(--ink); margin:0; padding:22px 20px 56px; display:flex; justify-content:center; min-height:100vh; }
.wrap{ width:100%; max-width:1080px; min-width:0; }
a{ color:var(--cyan); }
.eyebrow{ font-size:.8rem; font-weight:700; letter-spacing:.04em; color:var(--cyan); margin:0 0 6px; }
h1{ margin:0 0 8px; font-size:1.9rem; letter-spacing:-.02em; line-height:1.15; }
.lede{ color:var(--muted); font-size:1.02rem; margin:0 0 18px; line-height:1.5; max-width:68ch; }
.search{ margin:0 0 8px; }
.search input{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:.8rem .95rem; font-size:1rem; font-family:var(--sans); outline:none; box-shadow:var(--card-shadow); }
.search input:focus{ border-color:var(--cyan); }
.progress{ display:flex; align-items:center; gap:12px; margin:0 2px 4px; font-size:.9rem; color:var(--muted); min-height:1.5rem; }
.progress a{ font-size:.86rem; } .progress a[hidden]{ display:none; }
.subj{ margin:22px 0 0; }
.subj-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-bottom:12px; border-bottom:1px solid var(--line); }
.subj-head h2{ margin:0; font-size:1.5rem; letter-spacing:-.01em; }
.subj-head .meta{ font-size:.9rem; color:var(--muted); }
.subj-head .open{ margin-left:auto; text-decoration:none; font-weight:700; font-size:.92rem; padding:.6rem 1rem; border-radius:10px; background:var(--cyan); color:var(--on-accent); white-space:nowrap; }
.subj-head .open:hover{ filter:brightness(1.1); }
.topic{ margin-top:22px; }
.topic h3{ margin:0 0 10px; font-size:1.02rem; font-weight:700; color:var(--ink); }
.links{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
@media (max-width:900px){ .links{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (max-width:640px){ .links{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; } }
.links a{ position:relative; display:flex; flex-direction:column; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; min-width:0; box-shadow:var(--card-shadow); transition:border-color .15s, box-shadow .15s, transform .06s; }
.links a:hover, .links a:focus-visible{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, var(--card-shadow); outline:none; }
.links a:active{ transform:translateY(1px); }
.links img{ display:block; width:100%; height:auto; aspect-ratio:16 / 10; object-fit:cover; background:#070a13; }
.links .ttl{ padding:.65rem .8rem .75rem; font-size:.95rem; line-height:1.3; font-weight:600; }
.links .tick{ position:absolute; top:8px; left:8px; display:none; background:var(--green); color:var(--on-status); font-size:.74rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.35); }
.links a.seen .tick{ display:inline-block; }
.soon .subj-head h2{ color:var(--muted); }
.empty{ color:var(--muted); font-size:.95rem; padding:14px 2px; }
.foot{ margin-top:34px; color:var(--muted); font-size:.86rem; line-height:1.6; border-top:1px solid var(--line); padding-top:16px; }
@media (max-width:560px){
  body{ padding:14px 14px 40px; } h1{ font-size:1.5rem; }
  .subj-head .open{ margin-left:0; width:100%; text-align:center; }
  .links .ttl{ font-size:.86rem; padding:.5rem .6rem .6rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="sp"></span><button class="tool" id="themeBtn" type="button"></button></div>
  <p class="eyebrow">NSW Stage 6 · HSC Science</p>
  <h1>Science Simulations</h1>
  <p class="lede">Interactive simulations that run in your browser, on a phone or a laptop.</p>
  <div class="search"><input id="q" type="search" placeholder="Search for a simulation" aria-label="Search all simulations" autocomplete="off"></div>
  <p class="progress"><span data-progress></span><a href="#" data-reset-progress hidden>Clear ticks</a></p>
  <div id="subjects"></div>
  <p class="foot">Written for the NSW Stage 6 syllabuses.</p>
</div>
<script>
/* =====================================================================
   SUBJECTS — edit this list to add a subject or a simulation.
   Each subject lives in its own GitHub repository, so its address is
   the repository name, e.g. the "physics" repository -> "physics/".
   Each simulation is [title, address, thumbnail picture (optional)].
   Thumbnails are 640×400 images, e.g. "physics/thumbs/projectiles.webp".
   Set "soon: true" to show a subject as coming soon.
   ===================================================================== */
const SUBJECTS = [
  { name:"Chemistry", href:"chemistry/",
    topics:[
      { title:"Reaction rates", items:[
        ["Collision Theory Simulation", "chemistry/collision-theory/", "chemistry/thumbs/collision-theory.webp"] ] },
      { title:"Module 5 · Static and dynamic equilibrium", items:[
        ["Reversible or Not?", "chemistry/reversible-or-not/", "chemistry/thumbs/reversible-or-not.webp"],
        ["Dynamic Equilibrium Box", "chemistry/dynamic-equilibrium/", "chemistry/thumbs/dynamic-equilibrium.webp"],
        ["Why Some Reactions Never Come Back", "chemistry/entropy-enthalpy/", "chemistry/thumbs/entropy-enthalpy.webp"] ] },
      { title:"Module 5 · Factors that affect equilibrium", items:[
        ["Le Chatelier Lab", "chemistry/le-chatelier/", "chemistry/thumbs/le-chatelier.webp"],
        ["Graph Detective", "chemistry/graph-detective/", "chemistry/thumbs/graph-detective.webp"],
        ["Energy Profiles and Rates", "chemistry/energy-profiles/", "chemistry/thumbs/energy-profiles.webp"] ] },
      { title:"Module 5 · Calculating the equilibrium constant", items:[
        ["Keq Builder and Q vs K", "chemistry/keq-builder/", "chemistry/thumbs/keq-builder.webp"],
        ["ICE Table Trainer", "chemistry/ice-trainer/", "chemistry/thumbs/ice-trainer.webp"],
        ["Virtual Colorimeter Prac", "chemistry/colorimeter/", "chemistry/thumbs/colorimeter.webp"] ] },
      { title:"Module 5 · Solution equilibria", items:[
        ["Dissolving Up Close", "chemistry/dissolving/", "chemistry/thumbs/dissolving.webp"],
        ["Precipitation Spot Plate", "chemistry/precipitation/", "chemistry/thumbs/precipitation.webp"],
        ["Will It Precipitate? (Ksp)", "chemistry/ksp/", "chemistry/thumbs/ksp.webp"],
        ["Cycad Detoxification", "chemistry/cycad/", "chemistry/thumbs/cycad.webp"] ] }
    ] }
  // , { name:"Physics", href:"physics/", soon:true, topics:[] }
];

const host = document.getElementById("subjects");
function render(filter){
  const f = (filter || "").trim().toLowerCase(); host.textContent = ""; let shown = 0;
  SUBJECTS.forEach(s => {
    const all = s.topics || [];
    const topics = all.map(t => ({ title:t.title, items:t.items.filter(it => !f || (s.name + " " + t.title + " " + it[0]).toLowerCase().includes(f)) })).filter(t => t.items.length);
    if(f && !topics.length) return;
    shown++;
    const sec = document.createElement("section"); sec.className = "subj" + (s.soon ? " soon" : "");
    const count = all.reduce((n, t) => n + t.items.length, 0);
    const head = document.createElement("div"); head.className = "subj-head";
    const h2 = document.createElement("h2"); h2.textContent = s.name; head.appendChild(h2);
    const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = s.soon ? "Coming soon" : count + " simulation" + (count === 1 ? "" : "s"); head.appendChild(meta);
    if(!s.soon){ const a = document.createElement("a"); a.className = "open"; a.href = s.href; a.textContent = "Open " + s.name + " →"; head.appendChild(a); }
    sec.appendChild(head);
    (f ? topics : all).forEach(t => {
      const d = document.createElement("div"); d.className = "topic";
      const c = document.createElement("h3"); c.textContent = t.title; d.appendChild(c);
      const g = document.createElement("div"); g.className = "links";
      t.items.forEach(it => {
        const a = document.createElement("a"); a.href = it[1]; a.setAttribute("data-sim-link", it[1].replace(/\/+$/, ""));
        if(it[2]){ const im = document.createElement("img"); im.src = it[2]; im.alt = ""; im.width = 640; im.height = 400; im.loading = "lazy"; im.decoding = "async"; a.appendChild(im); }
        const tt = document.createElement("span"); tt.className = "ttl"; tt.textContent = it[0]; a.appendChild(tt);
        const tk = document.createElement("span"); tk.className = "tick"; tk.textContent = "✓ Opened"; a.appendChild(tk);
        g.appendChild(a);
      });
      d.appendChild(g); sec.appendChild(d);
    });
    host.appendChild(sec);
  });
  if(!shown){ const e = document.createElement("p"); e.className = "empty"; e.textContent = "No simulations match that search."; host.appendChild(e); }
  if(window.nsbPaintTicks) window.nsbPaintTicks();
}
document.getElementById("q").addEventListener("input", e => render(e.target.value));
render("");
</script>
<script>
/* ===== page shell: light/dark switch, full-screen mode, progress ticks (shared by every page) ===== */
(function(){
  "use strict";
  var root = document.documentElement;
  var store = {
    get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
    del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  var ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
    full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    exit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
  };

  /* ---------- light / dark ---------- */
  var themeBtn = document.getElementById("themeBtn");
  function systemTheme(){ return (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark"; }
  function paintTheme(){
    if(!themeBtn) return;
    var dark = root.getAttribute("data-theme") !== "light";
    themeBtn.innerHTML = (dark ? ICON.sun : ICON.moon) + '<span class="lbl">' + (dark ? "Light mode" : "Dark mode") + "</span>";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  function setTheme(t, remember){ root.setAttribute("data-theme", t); if(remember) store.set("nsb-theme", t); paintTheme(); }
  if(themeBtn) themeBtn.addEventListener("click", function(){ setTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light", true); });
  if(window.matchMedia){
    var mq = matchMedia("(prefers-color-scheme: light)"), follow = function(){ var s = store.get("nsb-theme"); if(s !== "light" && s !== "dark") setTheme(systemTheme(), false); };
    if(mq.addEventListener) mq.addEventListener("change", follow); else if(mq.addListener) mq.addListener(follow);
  }
  paintTheme();

  /* ---------- full screen: fills the screen and enlarges the simulation and its text ---------- */
  var fsBtn = document.getElementById("fsBtn");
  var reqFs = root.requestFullscreen || root.webkitRequestFullscreen, exitFs = document.exitFullscreen || document.webkitExitFullscreen;
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function paintFs(){
    if(!fsBtn) return;
    var on = root.classList.contains("present");
    fsBtn.innerHTML = (on ? ICON.exit : ICON.full) + '<span class="lbl">' + (on ? "Exit full screen" : "Full screen") + "</span>";
    fsBtn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
  }
  function scaleFor(){ return Math.max(1, Math.min(1.6, window.innerWidth / 1300)); }
  function present(on){
    root.classList.toggle("present", on);
    var s = on ? scaleFor() : 1;
    window.UI_SCALE = s; root.style.setProperty("--ui", String(s));
    if(!on) root.style.removeProperty("--ui");
    paintFs();
    try{ window.dispatchEvent(new Event("resize")); }catch(e){}
  }
  if(fsBtn){
    if(!reqFs || !exitFs){ fsBtn.hidden = true; }
    else {
      fsBtn.addEventListener("click", function(){
        if(fsElement()){ exitFs.call(document); return; }
        var p = reqFs.call(root); if(p && p.catch) p.catch(function(){ present(false); });
      });
      var onChange = function(){ present(!!fsElement()); };
      document.addEventListener("fullscreenchange", onChange); document.addEventListener("webkitfullscreenchange", onChange);
      window.addEventListener("resize", function(){
        if(!root.classList.contains("present")) return;
        var s = scaleFor(); if(Math.abs(s - (window.UI_SCALE || 1)) > 0.01){ window.UI_SCALE = s; root.style.setProperty("--ui", String(s)); }
      });
    }
    paintFs();
  }

  /* ---------- how-to box: remember if it was closed ---------- */
  var how = document.querySelector("details.howto");
  if(how){
    if(store.get("nsb-howto") === "closed") how.removeAttribute("open");
    how.addEventListener("toggle", function(){ store.set("nsb-howto", how.open ? "open" : "closed"); });
  }

  /* ---------- progress: remember which simulations this device has opened ---------- */
  function seen(){ try{ return JSON.parse(store.get("nsb-seen") || "{}") || {}; }catch(e){ return {}; } }
  var here = document.body.getAttribute("data-sim");
  if(here){ var m = seen(); if(!m[here]){ m[here] = 1; store.set("nsb-seen", JSON.stringify(m)); } }
  function paintTicks(){
    var m = seen(), cards = document.querySelectorAll("[data-sim-link]"), n = 0, i;
    for(i = 0; i < cards.length; i++){ var on = !!m[cards[i].getAttribute("data-sim-link")]; cards[i].classList.toggle("seen", on); if(on) n++; }
    var outs = document.querySelectorAll("[data-progress]");
    for(i = 0; i < outs.length; i++) outs[i].textContent = cards.length ? n + " of " + cards.length + " opened" : "";
    var resets = document.querySelectorAll("[data-reset-progress]");
    for(i = 0; i < resets.length; i++) resets[i].hidden = n === 0;
  }
  window.nsbPaintTicks = paintTicks;
  document.addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target.closest("[data-reset-progress]") : null;
    if(t){ e.preventDefault(); store.del("nsb-seen"); paintTicks(); }
  });
  window.addEventListener("pageshow", paintTicks);
  paintTicks();
})();

</script>
</body></html>
